# Sistem terdistribusi: Nginx + 2 app server Flask + Redis.
# Jalankan: docker compose up --build -d
#
# Penting: app2 diberi PORT=5002 supaya cocok dengan blok `upstream` pada
# nginx/nginx.conf. Tanpa itu kedua app server sama-sama mendengarkan 5001
# dan seluruh trafik hanya jatuh ke app1 (load balancing tidak pernah teruji).
services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    networks: [backend]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  app1:
    build: ./src/app
    environment:
      - SERVER_NAME=app1
      - REDIS_HOST=redis
      - PORT=5001
    networks: [backend]
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:5001/health').status==200 else 1)\""]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  app2:
    build: ./src/app
    environment:
      - SERVER_NAME=app2
      - REDIS_HOST=redis
      - PORT=5002
    networks: [backend]
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:5002/health').status==200 else 1)\""]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # Aplikasi client dilayani Nginx supaya berada di alamat yang sama
      # dengan load balancer (tidak ada permintaan lintas-asal).
      - ./src/client:/usr/share/nginx/html/klien:ro
    networks: [backend]
    depends_on:
      - app1
      - app2

volumes:
  redis-data:

networks:
  backend:
    driver: bridge
