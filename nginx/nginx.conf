# Load balancer: bagi permintaan ke kedua app server, buang yang tidak sehat.
#
# Catatan konfigurasi:
#  - app1 dan app2 wajib mendengarkan port yang sama dengan yang tertulis di
#    blok `upstream` di bawah (diatur lewat variabel PORT pada compose).
#  - max_fails/fail_timeout menentukan berapa kali gagal sebelum node dibuang.
#  - /health dipakai pemeriksaan aktif; /slow dipakai untuk menguji pembuangan
#    node karena batas waktu.

events { worker_connections 1024; }

http {
    # Log dengan waktu tanggap per permintaan, dipakai untuk membaca hasil uji.
    log_format uji '$remote_addr - [$time_local] "$request" $status '
                   'upstream=$upstream_addr waktu=$request_time';
    access_log /dev/stdout uji;

    upstream app_cluster {
        server app1:5001 max_fails=2 fail_timeout=10s;
        server app2:5002 max_fails=2 fail_timeout=10s;
        # Koneksi ke app server dipakai ulang agar permintaan ringan.
        # keepalive hanya berlaku bila proxy_http_version 1.1 dan header
        # Connection dikosongkan — lihat blok location di bawah.
        keepalive 16;
    }

    server {
        listen 80;

        # Aplikasi client. Dilayani langsung oleh Nginx supaya halaman dan
        # endpoint berada di alamat yang SAMA — client tetap hanya mengenal
        # satu alamat, dan tidak ada permintaan lintas-asal (CORS).
        # Pasang berkasnya di ./src/client, lihat docker-compose.yml.
        location /klien/ {
            alias /usr/share/nginx/html/klien/;
            index index.html;
        }
        location = /klien {
            return 301 /klien/;
        }

        location / {
            proxy_pass http://app_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            # Bila satu node gagal atau lewat batas waktu, permintaan
            # dipindahkan ke node lain dan dicatat.
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
            proxy_next_upstream_timeout 12s;
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
            # Header pembukti node mana yang melayani permintaan.
            add_header X-Served-By $upstream_addr always;
        }

        # Titik akhir pemeriksaan kesehatan untuk Nginx.
        location /health {
            proxy_pass http://app_cluster/health;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            access_log off;
        }

        # Permintaan lambat buatan, untuk menguji batas waktu baca.
        # Contoh: /slow?detik=8 akan melewati proxy_read_timeout 5s.
        location /slow {
            proxy_pass http://app_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
        }
    }
}
